<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>أحمد الحربي — Ahmed Alharbi</title>
  <meta name="description" content="أحمد الحربي: إدارة أعمال، تشغيل صحي، ومنتجات رقمية. مؤسس منصة مرشح." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛵</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=6" />
<body data-page="home">
  <!-- شاشة افتتاحية: تظهر مرة وحدة في كل زيارة -->
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-name"><span class="w"><span>أحمد</span></span> <span class="w"><span>الحربي</span></span></div>
    <div class="intro-line"></div>
  </div>
  <div id="header"></div>
  <div class="progress" id="progress" aria-hidden="true"></div>

  <main id="main">
    <!-- الهيرو -->
    <section class="hero pf-hero">
      <div class="container">
        <div class="eyebrow name-en intro-anim" style="--d:0" id="pfNameEn"></div>
        <h1 class="hero-title" id="pfName"></h1>
        <div class="pf-role intro-anim" style="--d:5" id="pfRole"></div>
        <div class="hero-sub intro-anim" style="--d:7">
          <div>
            <p id="pfIntro"></p>
            <p class="intro-en" id="pfIntroEn" lang="en" dir="ltr"></p>
          </div>
          <div class="hero-cta">
            <a href="#work" class="btn btn-primary">وش أبني</a>
            <a href="#contact" class="btn btn-ghost">تواصل معي</a>
          </div>
        </div>
        <div class="facts intro-anim" style="--d:9" id="pfFacts"></div>
      </div>
    </section>

    <!-- شريط الاهتمامات المتحرك -->
    <div class="marquee" aria-hidden="true"><div class="marquee-track" id="pfMarquee"></div></div>

    <!-- الأعمال -->
    <section id="work" class="reveal">
      <div class="container">
        <div class="sec-head"><div><div class="eyebrow">٠١ · What I Build</div><h2>وش أبني</h2></div><p>منتجات بنيتها وأطلقتها.</p></div>
        <div class="projects" id="pfWork"></div>
      </div>
    </section>

    <!-- النبذة والإنجازات -->
    <section id="about" class="soft reveal">
      <div class="container split">
        <div class="split-head"><div class="eyebrow">٠٢</div><h2>نبذة عني</h2></div>
        <div>
          <div class="pf-about" id="pfAbout"></div>
          <div class="stats" id="pfAchievements"></div>
        </div>
      </div>
    </section>

    <!-- الخبرات -->
    <section id="experience" class="reveal">
      <div class="container split">
        <div class="split-head"><div class="eyebrow">٠٣</div><h2>الخبرات والتعليم</h2></div>
        <ol class="timeline" id="pfExp"></ol>
      </div>
    </section>

    <!-- المهارات -->
    <section id="skills" class="soft reveal">
      <div class="container">
        <div class="sec-head"><div><div class="eyebrow">٠٤</div><h2>مهاراتي</h2></div></div>
        <div class="skills" id="pfSkills"></div>
        <div class="extras">
          <div><h3>اللغات</h3><ul class="langs" id="pfLangs"></ul></div>
          <div><h3>اهتماماتي</h3><div class="interests" id="pfInterests"></div></div>
        </div>
      </div>
    </section>

    <!-- التواصل -->
    <section id="contact" class="reveal">
      <div class="container contact">
        <div class="eyebrow">٠٥ · تواصل معي</div>
        <h2>عندك فكرة أو فرصة؟<br />خلنا نتكلم.</h2>
        <a class="contact-email" id="pfEmail" href="#"></a>
        <div class="contact-links" id="pfLinks"></div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/data.js?v=6"></script>
  <script src="js/main.js?v=6"></script>
</body>
</html>
